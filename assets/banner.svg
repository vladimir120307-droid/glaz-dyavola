<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="35%"  stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон: чистый, без сетки -->
  <rect width="1200" height="400" fill="#0a0606"/>

  <!-- Halo -->
  <ellipse cx="240" cy="200" rx="280" ry="200" fill="url(#halo)"/>

  <!-- Глаз: один сплошной круг + slit. Без век, без рогов, без огня. -->
  <g transform="translate(240,200)">
    <circle r="120" fill="url(#iris)"/>
    <ellipse rx="14" ry="100" fill="#000"/>
    <!-- единственный блик -->
    <circle cx="-40" cy="-50" r="14" fill="#fff7ed" opacity="0.85"/>
  </g>

  <!-- Текст -->
  <text x="500" y="170" fill="#fef3c7" font-size="80" font-weight="900" letter-spacing="6">ГЛАЗ</text>
  <text x="500" y="250" fill="#dc2626" font-size="80" font-weight="900" letter-spacing="6">ДЬЯВОЛА</text>
  <text x="502" y="290" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="2">
    OSINT · Russian intel · MCP-native · MIT
  </text>

  <!-- Чипы -->
  <g font-size="13" fill="#cbd5e1" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="600">
    <rect x="500" y="318" width="120" height="30" rx="6" fill="#1c0303" stroke="#7f1d1d"/>
    <text x="510" y="338">15 modules</text>
    <rect x="628" y="318" width="120" height="30" rx="6" fill="#1c0303" stroke="#7f1d1d"/>
    <text x="638" y="338">65+ regexes</text>
    <rect x="756" y="318" width="120" height="30" rx="6" fill="#1c0303" stroke="#7f1d1d"/>
    <text x="766" y="338">22 commands</text>
    <rect x="884" y="318" width="100" height="30" rx="6" fill="#7c2d12" stroke="#dc2626"/>
    <text x="894" y="338" fill="#fed7aa">RU layer</text>
  </g>

  <text x="1170" y="385" text-anchor="end" fill="#475569" font-size="11"
        font-family="ui-monospace,Menlo,Consolas,monospace">v0.3.0</text>
</svg>
