name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check glaz tests

      - name: Test (pytest)
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v

      - name: Smoke test CLI
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m glaz.cli version
          python -m glaz.cli ru phone "+7 916 123 45 67"

  secret-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write   # требуется для upload-sarif
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scan repo for secrets
        run: |
          python -m glaz.cli secrets . --sarif glaz.sarif --workers 2 || true
      - name: Upload SARIF as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glaz-sarif
          path: glaz.sarif
          if-no-files-found: warn
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true   # если code-scanning не включен — артефакт уже сохранён
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: glaz.sarif
          category: glaz-dyavola
