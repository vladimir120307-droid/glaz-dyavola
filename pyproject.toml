[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "glaz-dyavola"
version = "0.3.0"
description = "Глаз Дьявола — OSINT-инструмент с русскоязычным контуром (DNS, subdomains, secrets, identity-fabric, ЕГРЮЛ/ВК/Яндекс)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vladimir", email = "vladimir120307@gmail.com" }]
keywords = ["osint", "recon", "security", "russia", "ru", "asset-graph", "subdomain", "secrets", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "dnspython>=2.6",
    "pydantic>=2.6",
    "tldextract>=5.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
glaz = "glaz.cli:app"

[project.urls]
Homepage = "https://github.com/vladimir/glaz-dyavola"
Issues = "https://github.com/vladimir/glaz-dyavola/issues"

[tool.hatch.build.targets.wheel]
packages = ["glaz"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # typer.Option/Argument in defaults is the typer pattern
    "SIM108", # ternaries can hurt readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
